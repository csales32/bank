<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orange Bank — Extrato</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🟠</span>
      <span class="logo-text">Orange <strong>Bank</strong></span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Início</span></a>
      <a href="extrato.html" class="nav-item active"><span class="nav-icon">📋</span><span>Extrato</span></a>
      <a href="transferencia.html" class="nav-item"><span class="nav-icon">🔄</span><span>Transferir</span></a>
      <a href="pix.html" class="nav-item"><span class="nav-icon">⚡</span><span>Pix</span></a>
      <a href="cartoes.html" class="nav-item"><span class="nav-icon">💳</span><span>Cartões</span></a>
      <a href="investimentos.html" class="nav-item"><span class="nav-icon">📈</span><span>Investimentos</span></a>
      <a href="pagamentos.html" class="nav-item"><span class="nav-icon">📄</span><span>Pagamentos</span></a>
      <a href="perfil.html" class="nav-item"><span class="nav-icon">👤</span><span>Perfil</span></a>
    </nav>
    <button class="sidebar-logout" onclick="logout()"><span>🚪</span> Sair</button>
  </aside>

  <div class="app-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-greeting"><span>Extrato</span></div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="showNotifications()">🔔<span class="badge">3</span></button>
        <div class="avatar" onclick="window.location='perfil.html'">CR</div>
      </div>
    </header>

    <main class="main-area">

      <section class="extrato-header">
        <div class="extrato-period">
          <button class="period-btn active" onclick="filterPeriod(this,7)">7 dias</button>
          <button class="period-btn" onclick="filterPeriod(this,15)">15 dias</button>
          <button class="period-btn" onclick="filterPeriod(this,30)">30 dias</button>
          <button class="period-btn" onclick="filterPeriod(this,90)">3 meses</button>
        </div>
        <div class="extrato-filters">
          <select id="filterType" onchange="renderExtrato()">
            <option value="">Todos</option>
            <option value="pix">Pix</option>
            <option value="ted">TED/DOC</option>
            <option value="boleto">Boleto</option>
            <option value="cartao">Cartão</option>
            <option value="credito">Crédito</option>
          </select>
          <button class="btn btn-sm btn-outline" onclick="exportExtrato()">⬇ Exportar PDF</button>
        </div>
      </section>

      <!-- RESUMO -->
      <div class="extrato-summary">
        <div class="summary-card green">
          <span>Entradas</span>
          <strong id="totalIn">R$ 0,00</strong>
        </div>
        <div class="summary-card red">
          <span>Saídas</span>
          <strong id="totalOut">R$ 0,00</strong>
        </div>
        <div class="summary-card">
          <span>Saldo do período</span>
          <strong id="totalBal">R$ 0,00</strong>
        </div>
      </div>

      <div class="extrato-list" id="extratoList"></div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
